{{ $icon := .Get "icon" }}
<div class="card-interactive">
    <div class="w-10 h-10 rounded-lg bg-primary-50 flex items-center justify-center mb-5 accent-tile">
        <svg class="w-5 h-5 accent-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            {{ if eq $icon "lightbulb" }}
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
            {{ else if eq $icon "users" }}
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
            {{ else if eq $icon "eye" }}
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            {{ end }}
        </svg>
    </div>
    <h3 class="text-base font-semibold text-gray-900 mb-2">{{ .Get "title" }}</h3>
    <p class="text-sm text-gray-500 leading-relaxed">{{ .Get "description" }}</p>
</div>
