<div class="team-member">
    <div class="relative mb-5 rounded-xl overflow-hidden aspect-square border border-gray-200">
        {{ with .Get "image" }}
        <img src="{{ . | relURL }}" alt="{{ $.Get "name" }}" class="w-full h-full object-cover" loading="lazy">
        {{ else }}
        <div class="w-full h-full bg-gray-100 flex items-center justify-center">
            <svg class="w-16 h-16 text-gray-400" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 14c3.31 0 6-2.69 6-6s-2.69-6-6-6-6 2.69-6 6 2.69 6 6 6zm0 2c-4 0-12 2-12 6v2h24v-2c0-4-8-6-12-6z"/>
            </svg>
        </div>
        {{ end }}
    </div>
    <h3 class="text-base font-semibold text-gray-900">{{ .Get "name" }}</h3>
    <p class="mt-1 text-sm text-gray-500 leading-relaxed">{{ .Get "title" }}</p>
    {{ with .Get "linkedin" }}
    {{ if ne . "#" }}
    <a href="{{ . }}" target="_blank" rel="noopener noreferrer"
       class="mt-3 inline-flex items-center gap-1.5 text-sm font-medium text-primary-600 hover:text-primary-700 transition-colors accent-icon">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
        </svg>
        LinkedIn
    </a>
    {{ end }}
    {{ end }}
</div>
