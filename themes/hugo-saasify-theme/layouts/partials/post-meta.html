<div class="flex flex-col gap-5">
    <!-- Author, reading time, date -->
    <div class="flex items-center flex-wrap gap-2 text-sm text-gray-500">
        {{ with .Params.author }}
            <span class="font-medium text-gray-700">{{ . }}</span>
            <span aria-hidden="true" class="text-gray-300">&middot;</span>
        {{ end }}

        <time datetime="{{ .Date.Format "2006-01-02" }}">
            {{ .Date.Format (i18n "dateFormat" .) }}
        </time>

        <span aria-hidden="true" class="text-gray-300">&middot;</span>
        <span>{{ .ReadingTime }} {{ i18n "minRead" . }}</span>
    </div>

    <!-- Tags -->
    {{ with .Params.tags }}
        <div class="flex items-center flex-wrap gap-2">
            {{ range . }}
                <a href="{{ "/tags/" | relLangURL }}{{ . | urlize }}"
                   class="px-2.5 py-1 border border-gray-200 hover:border-gray-300 hover:bg-gray-50 rounded-md text-xs text-gray-500 hover:text-gray-700 transition-colors">
                    {{ . }}
                </a>
            {{ end }}
        </div>
    {{ end }}
</div>
