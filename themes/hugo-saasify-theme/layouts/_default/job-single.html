{{ define "main" }}
<div>
    <!-- Job Header -->
    <section class="band-dark py-16 md:py-20">
        <div class="container">
            <div class="max-w-3xl mx-auto text-center">
                <div class="eyebrow justify-center mb-4">Open Role</div>
                <h1 class="text-3xl md:text-4xl font-semibold tracking-tight mb-6">{{ .Title }}</h1>
                <div class="flex flex-wrap items-center justify-center gap-x-6 gap-y-2 text-sm">
                    {{ with .Params.location }}
                    <span class="flex items-center gap-2">
                        <span aria-hidden="true">📍</span>{{ . }}
                    </span>
                    {{ end }}
                    {{ with .Params.type }}
                    <span class="flex items-center gap-2">
                        <span aria-hidden="true">💼</span>{{ . }}
                    </span>
                    {{ end }}
                    {{ with .Params.salary }}
                    <span class="flex items-center gap-2">
                        <span aria-hidden="true">💰</span>{{ . }}
                    </span>
                    {{ end }}
                </div>
            </div>
        </div>
    </section>

    <!-- Job Content -->
    <div class="section">
        <div class="container">
            <div class="card p-8 lg:p-12">
                <div class="prose prose-lg max-w-none">
                    <div class="text-gray-600 text-lg mb-8">{{ .Description }}</div>
                    {{ .Content }}
                </div>
            </div>
            
            <div class="mt-8 text-center">
                <a href="{{ "/careers" | relLangURL }}" class="inline-flex items-center text-primary-600 hover:text-primary-700">
                    <span class="mr-2">←</span>
                    View All Positions
                </a>
            </div>
        </div>
    </div>
</div>
{{ end }}
