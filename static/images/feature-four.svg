<svg width="480" height="360" viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg">
<defs>
  <pattern id="dotGrid4" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.5" fill="#94A3B8" opacity="0.25"/>
  </pattern>
  <filter id="cardShadow4" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0A0F1E" flood-opacity="0.10"/>
  </filter>
  <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
</defs>

<rect width="480" height="360" fill="#F8FAFC"/>
<rect width="480" height="360" fill="url(#dotGrid4)"/>

<rect x="60" y="60" width="100" height="240" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="190" y="60" width="100" height="240" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="320" y="60" width="100" height="240" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>

<rect x="76" y="80" width="68" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" filter="url(#cardShadow4)"/>
<rect x="76" y="126" width="68" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" filter="url(#cardShadow4)"/>

<ellipse cx="175" cy="200" rx="46" ry="20" fill="#7C3AED" opacity="0.18" filter="url(#glowPurple)"/>
<rect x="152" y="184" width="68" height="34" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2" filter="url(#cardShadow4)"/>
<path d="M224 200 l10 -6 v12 z" fill="#7C3AED"/>

<rect x="206" y="80" width="68" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" filter="url(#cardShadow4)"/>

<rect x="336" y="80" width="68" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" filter="url(#cardShadow4)"/>
<rect x="336" y="126" width="68" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" filter="url(#cardShadow4)"/>
<rect x="336" y="172" width="68" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" filter="url(#cardShadow4)"/>

<g transform="translate(400,300)">
  <circle r="26" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow4)"/>
  <circle r="18" fill="none" stroke="#F1F5F9" stroke-width="6"/>
  <circle r="18" fill="none" stroke="#7C3AED" stroke-width="6" stroke-linecap="round"
    stroke-dasharray="85 113" transform="rotate(-90)"/>
