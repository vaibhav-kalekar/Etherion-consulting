<svg width="480" height="360" viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg">
<defs>
  <pattern id="dotGrid1" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.5" fill="#94A3B8" opacity="0.25"/>
  </pattern>
  <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0A0F1E" flood-opacity="0.10"/>
  </filter>
</defs>

<rect width="480" height="360" fill="#F8FAFC"/>
<rect width="480" height="360" fill="url(#dotGrid1)"/>

<rect x="96" y="56" width="150" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
<rect x="128" y="70" width="16" height="16" rx="4" fill="#E2E8F0"/>
<rect x="152" y="74" width="80" height="8" rx="4" fill="#E2E8F0"/>

<rect x="234" y="264" width="150" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
<rect x="266" y="278" width="16" height="16" rx="4" fill="#E2E8F0"/>
<rect x="290" y="282" width="80" height="8" rx="4" fill="#E2E8F0"/>

<circle cx="240" cy="180" r="80" fill="#059669" opacity="0.14" filter="url(#glowGreen)"/>

<rect x="140" y="90" width="200" height="180" rx="20" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>

<path d="M240 130 L280 145 V185 C280 215 262 235 240 245 C218 235 200 215 200 185 V145 Z"
  fill="none" stroke="#059669" stroke-width="3.5" stroke-linejoin="round"/>
